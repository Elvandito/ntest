name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Point Gradle at the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk_dir" ]; then
            echo "Android SDK not found at $sdk_dir" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$sdk_dir" > local.properties
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            echo "sdkmanager not found at $sdkmanager_path" >&2
            exit 1
          fi
          set +e
          yes | "$sdkmanager_path" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platform-tools" \
            "emulator"
          install_status="${PIPESTATUS[1]}"
          set -e
          if [ "$install_status" -ne 0 ]; then
            echo "sdkmanager failed with exit code ${install_status}" >&2
            exit "$install_status"
          fi

      - name: Show toolchain versions
        shell: bash
        run: |
          gradle --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Build APKs and AABs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleDebug :app:bundleRelease

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest

      - name: List generated artifacts
        shell: bash
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Upload APKs and AABs
        uses: actions/upload-artifact@v4
        with:
          name: netband-android-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Install debug APK on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: netband-android-${{ github.sha }}
          path: artifact

      - name: Install fallback su build tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch the debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netband-screenshots-${{ github.sha }}
          path: screenshots/*
          if-no-files-found: error
          retention-days: 14
